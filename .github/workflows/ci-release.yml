name: CI & Release

# PR 上只跑检查；合并到 master（push）后跑检查，通过则自动生成 release。
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: 前端与 Electron 脚本语法检查
        run: |
          node --check internal/server/web/app.js
          node --check electron/main.js

  build:
    name: 打包 ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Windows x64,   os: windows-latest, goos: windows, goarch: amd64, args: "--win --x64" }
          - { name: macOS arm64,   os: macos-latest,   goos: darwin,  goarch: arm64, args: "--mac --arm64" }
          - { name: macOS x64,     os: macos-latest,   goos: darwin,  goarch: amd64, args: "--mac --x64" }
          - { name: Linux x64,     os: ubuntu-latest,  goos: linux,   goarch: amd64, args: "--linux --x64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: 安装依赖
        working-directory: electron
        run: npm ci
      - name: 编译内嵌的 Go 本机服务
        working-directory: electron
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: node scripts/build-server.js
      - name: 打包桌面客户端
        working-directory: electron
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: timetrace-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.AppImage
          if-no-files-found: error

  release:
    name: 发布 Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 tag 和 release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 生成校验和
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 创建 Release
        run: |
          set -euo pipefail
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
